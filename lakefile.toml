name = "MonomialOrderedPolynomial"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MonomialOrderedPolynomial"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
backward.isDefEq.respectTransparency = false

[[require]]
name = "lean4export"
scope = "leanprover"

[[require]]
name = "groebner"
scope = "WuProver"
git = "https://github.com/WuProver/groebner_proj"
rev = "a34921b6a211a8242c3aaf39759a6d48c6b67e67"

[[lean_lib]]
name = "MonomialOrderedPolynomial"
